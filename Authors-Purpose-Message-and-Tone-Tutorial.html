:root{--ink:#173f49;--teal:#087f8c;--sand:#fff4d8}*{box-sizing:border-box}body{margin:0;background:#edf8f7;color:var(--ink);font:18px/1.6 system-ui,sans-serif}header{background:#173f49;color:white;padding:24px max(20px,calc((100vw - 1000px)/2));}h1{font-size:clamp(26px,5vw,40px);margin:6px 0}header p{margin:4px 0}main{max-width:1000px;margin:22px auto;padding:0 18px}.panel{background:white;border-radius:18px;padding:clamp(18px,4vw,36px);box-shadow:0 8px 30px #173f4910}h2{line-height:1.25}button{font:inherit;background:var(--teal);color:white;border:0;border-radius:9px;padding:11px 18px;cursor:pointer;margin:7px 5px 7px 0}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #dc9a1a;outline-offset:3px}input,textarea{font:inherit}input[type=text],input:not([type]),textarea{width:100%;padding:10px;border:2px solid #9cbfc3;border-radius:8px}textarea{display:block;margin:8px 0 18px;min-height:110px}label.writing{display:block;font-weight:600;margin:18px 0}.callout{background:var(--sand);border-left:5px solid #e2aa37;padding:18px;margin:20px 0}.passage{background:#f2f8fa;border:1px solid #b8d7dc;padding:22px;border-radius:12px;margin:20px 0}.question{border-top:2px solid #d7e9eb;margin-top:25px;padding-top:20px}.badge{font-size:14px;font-weight:bold;color:#086875}.option{display:block;padding:12px;border:1px solid #bdd8da;border-radius:8px;margin:8px 0;cursor:pointer}.option:has(input:checked){background:#d7f1ef;border-color:var(--teal)}input[type=radio],input[type=checkbox]{width:20px;height:20px;vertical-align:middle;accent-color:var(--teal)}table{border-collapse:collapse;width:100%;font-size:16px}td,th{padding:12px;text-align:left;vertical-align:top;border:1px solid #b9d5d7}th{background:#dff2f1}.feedback{background:#edf6f2;padding:12px;display:none}nav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}nav button{font-size:14px;margin:0;background:#45656c}nav button.current{background:#087f8c}progress{width:100%;height:12px;accent-color:#e8b745}.footer{display:flex;justify-content:space-between;margin:14px 0}details{margin:16px 0;border:1px solid #bed6d9;padding:14px;border-radius:8px}summary{cursor:pointer;font-weight:bold}.muted{font-size:14px}#report{white-space:pre-wrap;background:#fff8e8;padding:20px;margin-top:20px;overflow-wrap:anywhere}#report:empty{display:none}@media(max-width:600px){td,th{padding:7px;font-size:14px}.panel{padding:18px}.passage{padding:14px}}@media print{body{background:white;font-size:12pt}header,nav,.footer,#teacher,.panel>*{display:none!important}.panel #report{display:block!important;white-space:pre-wrap;background:white;padding:0}.panel{box-shadow:none;padding:0}main{margin:0;max-width:none}#report{border:0}}
</style></head><body><header><p>🌊 FLORIDA STANDARDS SPRINTS • ELA.6.R.2.1 • ELA.6.R.2.3</p><h1>Author’s Purpose, Message & Tone</h1><p>WHY • WHAT • ATTITUDE</p><progress id="progress" max="8" value="1"></progress></header><main><nav id="nav" aria-label="Lesson sections"></nav><article id="panel" class="panel"></article><div class="footer"><button id="back">← Back</button><button id="next">Next →</button></div></main><script>
const sections=[{"title": "Your mission", "time": 2, "body": "<h2>Read the words. Discover the intention.</h2><p>Why did the author write this? What does the author want readers to understand? How does the author feel about the subject? These are three different questions\u2014and strong readers can answer all three.</p><div class=\"callout\"><b>I can\u2026</b><ul><li>Distinguish the author\u2019s purpose, message, and tone.</li><li>Recognize describing, informing, narrating, and persuading\u2014and explain a primary purpose.</li><li>Set my own purpose for reading using genre, title, and text features.</li><li>Explain how sections and features convey meaning.</li><li>Analyze word choice and figurative language as evidence of tone.</li><li>Compare purposes in two accounts of the same event.</li></ul></div><p><b>Standards focus:</b> ELA.6.R.2.1 (sections/features), ELA.6.R.2.3 (purpose across accounts), ELA.6.R.3.1 (figurative language, tone, meaning). Supporting work: ELA.6.R.2.2 (central ideas), K12.EE.1.1 (evidence), K12.EE.3.1 (inferences).</p><label>Your name <input id=\"student\" placeholder=\"First and last name\"></label><p>Read each section, complete the checks, and study the feedback. Type your own explanations. At the end, save your completion report for Canvas. Your work saves in this browser when local storage is available.</p>"}, {"title": "Purpose, message & tone", "time": 6, "body": "<h2>Three questions. Three kinds of answers.</h2><table><tr><th>Concept</th><th>Question</th><th>Answer pattern</th></tr><tr><td><b>Purpose</b></td><td>WHY did the author write?</td><td>To narrate a meaningful experience and reflect on its significance.</td></tr><tr><td><b>Message</b></td><td>WHAT does the author want readers to understand?</td><td>A small act of kindness can help someone feel accepted.</td></tr><tr><td><b>Tone</b></td><td>HOW does the author express an attitude toward the subject?</td><td>Grateful and reflective, shown by appreciative words and thoughtful reflection.</td></tr></table><div class=\"callout\"><b>Remember: Purpose = WHY \u2022 Message = WHAT \u2022 Tone = ATTITUDE.</b><p>Reader\u2019s mood is the feeling the text creates in you. Tone is the author\u2019s attitude expressed in the text. They may be related, but they are not the same.</p></div><h3>Four broad purposes</h3><table><tr><th>Purpose</th><th>Typical clues</th><th>Be careful!</th></tr><tr><td>Describe</td><td>Sensory details show what something is like.</td><td>A description may support a bigger narrative or persuasive purpose.</td></tr><tr><td>Inform</td><td>Facts, explanations, definitions, or procedures build understanding.</td><td>Facts may also support persuasion.</td></tr><tr><td>Narrate</td><td>Events unfold with people, a setting, and changes over time.</td><td>A narrator may also reflect, describe, or persuade.</td></tr><tr><td>Persuade</td><td>Claims and reasons encourage a belief or action.</td><td>Persuasion does not have to sound angry or use \u201cyou should.\u201d</td></tr></table><p>The <b>primary purpose</b> best explains the text as a whole. An author may have several purposes. Look at how most details work together rather than counting one clue.</p><p>An <b>autobiography</b> is a person\u2019s account of their own life. A <b>memoir</b> usually focuses on selected experiences and what they mean. Both typically narrate, but they may also describe, inform, or persuade. A first-person narrator in fiction does not make the text an autobiography.</p><div class=\"question\" data-id=\"q1\" data-answer=\"1\" data-why=\"This explains why the author wrote. Grateful identifies tone; the kindness statement identifies a message.\"><span class=\"badge\">Select one</span><h3>Which statement explains an author\u2019s purpose?</h3><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"0\"> The writer sounds grateful.</label><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"1\"> The writer wants to recount a difficult first day and reflect on the help she received.</label><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"2\"> Kindness can create belonging.</label><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"3\"> The school hallway is crowded.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q2\" data-answer=\"2\" data-why=\"Description and facts support the larger goal of encouraging volunteers. Consider the whole text.\"><span class=\"badge\">Select one</span><h3>A writer describes a broken bench, gives repair costs, and asks neighbors to volunteer. What is the likely PRIMARY purpose?</h3><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"0\"> Describe, because the bench has a color.</label><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"1\"> Narrate, because volunteers are people.</label><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"2\"> Persuade, because the details support a request for action.</label><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"3\"> Inform, because any number makes a text only informative.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div>"}, {"title": "Set your reading purpose", "time": 4, "body": "<h2>The author has a purpose. You need one, too.</h2><p><b>Author\u2019s purpose:</b> why the writer created the text. <b>Reader\u2019s purpose:</b> what YOU want or need to gain from reading. You might read a memoir to understand a turning point, while its author writes to share and reflect on that experience.</p><div class=\"callout\"><b>Before reading: Preview \u2192 Predict \u2192 Plan.</b><ol><li><b>Preview:</b> identify the genre; read the title; scan headings, captions, illustrations, and the opening and ending.</li><li><b>Predict:</b> make a tentative prediction about the subject and purpose. A title is a clue, not proof.</li><li><b>Plan:</b> write a focused goal: \u201cI will read to understand how ___ and identify evidence of ___.\u201d</li></ol></div><p>During reading, annotate details that answer your goal. After reading, check and revise your prediction. A purpose for reading helps you focus; it does not mean skipping details that challenge your first idea.</p><div class=\"passage\"><h3>Preview card: \u201cThe Seat Beside Me\u201d</h3><p>Genre: memoir-style personal account<br>Opening: \u201cI rehearsed my introduction three times before entering the club.\u201d<br>Ending: \u201cNow I leave the chair beside me empty until someone new arrives.\u201d</p></div><div class=\"question\" data-id=\"q3\" data-answer=\"3\" data-why=\"The genre and opening/ending suggest a personal change related to belonging. This goal focuses reading while remaining open to the full text.\"><span class=\"badge\">Select one</span><h3>Which is the most useful reading purpose for this preview?</h3><label class=\"option\"><input type=\"radio\" name=\"q3\" value=\"0\"> Find every word beginning with s.</label><label class=\"option\"><input type=\"radio\" name=\"q3\" value=\"1\"> Decide that the author is angry before reading.</label><label class=\"option\"><input type=\"radio\" name=\"q3\" value=\"2\"> Learn the exact price of all the chairs.</label><label class=\"option\"><input type=\"radio\" name=\"q3\" value=\"3\"> Understand how the writer\u2019s experience changes her approach to welcoming others.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><label class=\"writing\">Write YOUR purpose for reading \u201cThe Seat Beside Me.\u201d Use the genre and one preview clue to explain your choice.<textarea id=\"toolkit\" rows=\"4\" placeholder=\"Explain your thinking using specific text evidence.\"></textarea></label>"}, {"title": "Titles, sections & features", "time": 4, "body": "<h2>Explain what a feature helps us understand.</h2><p>Naming a feature is only the first step. Explain the meaning it conveys and how it connects to the text\u2019s purpose or message.</p><table><tr><th>Feature or section</th><th>What it can contribute</th><th>Strong explanation</th></tr><tr><td>Title</td><td>Emphasizes an idea, relationship, or question.</td><td>\u201cThe Seat Beside Me\u201d draws attention to a place that becomes a sign of belonging.</td></tr><tr><td>Heading</td><td>Organizes a section\u2019s focus or marks a shift.</td><td>\u201cA Different Welcome\u201d signals a movement from the writer\u2019s fear to another person\u2019s response.</td></tr><tr><td>Caption</td><td>Explains an image or points out a significant detail.</td><td>A caption about an open chair connects a physical detail to the writer\u2019s later habit.</td></tr><tr><td>Opening</td><td>Establishes a situation, conflict, claim, or central idea.</td><td>An anxious opening makes the later welcome meaningful.</td></tr><tr><td>Ending</td><td>Reflects, synthesizes, calls for action, or reinterprets earlier details.</td><td>A return to the chair shows how the experience affects the writer\u2019s behavior.</td></tr></table><p><b>Meaning frame:</b> \u201cThe ___ emphasizes ___. It helps readers understand ___ because ___.\u201d Avoid stopping at \u201cIt grabs attention\u201d or \u201cIt tells what the section is about.\u201d</p><div class=\"question\" data-id=\"q4\" data-answer=\"2\" data-why=\"The explanation connects the feature to a significant idea and its development.\"><span class=\"badge\">Select one</span><h3>Which explanation analyzes how a title conveys meaning?</h3><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"0\"> The title is printed above the text.</label><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"1\"> The title has five words.</label><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"2\"> The title directs attention to the chair, which changes from an ordinary seat to a symbol of welcome.</label><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"3\"> The title makes readers read.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div>"}, {"title": "Watch a reader think", "time": 7, "body": "<p>The following is an original fictional memoir-style model, written to practice analyzing a personal account.</p><div class=\"passage\"><h3>The Seat Beside Me</h3><p><b>[1]</b> I rehearsed my introduction three times before entering the club. Through the library door I could hear people laughing over a half-built model bridge. I imagined my words snapping like the thin sticks on their table. I was new to the school, and even a cheerful room could feel like a place where everyone had already chosen a side.</p><p><b>[2]</b> A girl named Elena moved her notebook from the chair beside her. \u201cWe need someone to test this,\u201d she said, sliding a toy truck toward me. She did not ask me to introduce myself to the whole room. I sat down and pushed the truck onto the bridge. The middle sagged, and a wheel caught between two sticks. \u201cThat\u2019s useful,\u201d Elena said. \u201cNow we know what to fix.\u201d</p><p><b>[3]</b> For the next hour, we adjusted the supports and tested the truck again. When I suggested a wider center, Elena handed me the glue. My name came up naturally while we worked. By the time the librarian reminded us to pack up, I had forgotten the speech I had practiced.</p><p><b>[4]</b> I still remember that open chair more clearly than the bridge we built. Elena\u2019s invitation was a small doorway in what had seemed like a solid wall. She made room for my ideas before expecting me to explain myself. Now I leave the chair beside me empty until someone new arrives.</p></div><h2>Model the reasoning</h2><p><b>Purpose:</b> mainly to narrate and reflect on a welcome that changed the writer. The sequence moves from anxiety to participation, then reflection. Description supports that narrative.</p><p><b>Message:</b> making space for someone\u2019s participation can help that person feel included. Elena offers a useful role instead of putting the newcomer on the spot; the ending shows the writer offering the same welcome to others.</p><p><b>Tone:</b> initially apprehensive, then appreciative and reflective. \u201cRehearsed\u2026three times\u201d and the imagined snapping words show worry. Remembering the chair and changing her own behavior show appreciation.</p><p><b>Figurative language:</b> \u201ca small doorway\u201d in a \u201csolid wall\u201d compares Elena\u2019s invitation to an opening through a barrier. The metaphor shows that welcome makes a seemingly closed social space accessible. It contributes to appreciative tone and the message about inclusion.</p><p><b>Structure:</b> the last paragraph looks back on an ordinary object and reveals its significance. It changes the focus from what the group built to how the writer felt and what she learned.</p><div class=\"callout\"><b>Remember the evidence chain:</b> Exact words/detail \u2192 what they suggest \u2192 how they support purpose, message, or tone.</div><div class=\"question\" data-id=\"q5\" data-answer=\"0\" data-why=\"Appreciation describes the attitude conveyed by the narrator; encouragement describes a possible response in the reader.\"><span class=\"badge\">Select one</span><h3>Which statement best distinguishes tone from mood in this model?</h3><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"0\"> The writer expresses appreciation; readers may feel encouraged by her experience.</label><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"1\"> The writer has no tone because the story is fictional.</label><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"2\"> The writer\u2019s tone must match every reader\u2019s feeling.</label><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"3\"> The bridge is a tone.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q6\" data-answer=\"1\" data-why=\"The ending develops the message by showing a lasting change rather than only recounting the club activity.\"><span class=\"badge\">Select one</span><h3>Why does the writer end with her own practice of leaving a chair open?</h3><label class=\"option\"><input type=\"radio\" name=\"q6\" value=\"0\"> To explain how to arrange all library furniture.</label><label class=\"option\"><input type=\"radio\" name=\"q6\" value=\"1\"> To reveal that the experience influences how she now welcomes others.</label><label class=\"option\"><input type=\"radio\" name=\"q6\" value=\"2\"> To prove that the bridge won a contest.</label><label class=\"option\"><input type=\"radio\" name=\"q6\" value=\"3\"> To introduce an unrelated topic.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><label class=\"writing\">Explain how \u201ca small doorway\u201d and \u201ca solid wall\u201d contribute to BOTH the tone and the message. Use the metaphor\u2019s meaning in your explanation.<textarea id=\"guided\" rows=\"4\" placeholder=\"Explain your thinking using specific text evidence.\"></textarea></label>"}, {"title": "Two accounts: compare & prove", "time": 11, "body": "<p>Read both accounts of the same fictional event. Ask how each author selects details to serve a different purpose. These are original FAST-style practice items, not official test questions.</p><div class=\"passage\"><h3>Account A: A Beginning in the Mud \u2022 Fictional memoir-style account</h3><p><b>[1]</b> At 8:15 on Saturday, I unlocked the back gate of the neighborhood reading garden. A storm had scattered branches across the path, and muddy water had reached the lowest shelf of our outdoor book cabinet. I had helped paint that cabinet the previous month. Seeing its swollen doors, I felt as if the storm had erased our work with one careless swipe.</p><p><b>[2]</b> No one had assigned jobs yet. I began dragging branches toward the curb, determined to make the path look normal before anyone noticed the damaged books. My neighbor Mrs. Chen arrived carrying empty trays. She placed the wet books open on them and asked whether I could find a dry place under the shelter. I told her that the cabinet was ruined. She studied the books instead. \u201cLet\u2019s find out what we can still save.\u201d</p><p><b>[3]</b> Within an hour, six neighbors had arrived. One cleared the drainage ditch, another moved the lower shelves, and two children sorted books with dry pages from those still damp. I started recording titles so we would know which books needed replacing. The cabinet still leaned, but now I could see the work inside it instead of only the damage outside.</p><p><b>[4]</b> By noon, the path was clear. Some books could not be saved; their ink had blurred into blue-gray clouds. Others stood drying beneath the shelter. Mrs. Chen showed me the title list and asked which replacements children would actually read. For the first time that morning, I imagined the cabinet holding new stories instead of the storm\u2019s leftovers.</p><p><b>[5]</b> We did not restore everything that day. I wish I could claim we did. What we restored first was our willingness to begin. When I locked the gate, the crooked cabinet was still there, but it no longer looked like an ending.</p></div><div class=\"passage\"><h3>Account B: Keep the Reading Garden Open</h3><p><b>Genre:</b> Fictional community newsletter editorial about the same cleanup.</p><h4>What Saturday Revealed</h4><p><b>[1]</b> Saturday\u2019s storm cleanup showed both the value and the vulnerability of our reading garden. Six neighbors cleared the path and sorted books. Their work reopened the space, but goodwill alone cannot keep stormwater away from books. We should use this setback to make a more reliable plan.</p><h4>A Practical Next Step</h4><p><b>[2]</b> The volunteer team\u2019s title list records twelve books that need replacing and twenty-three that were kept for drying and review. The lowest shelf sat close to the ground, where water collected. Before buying replacement books, we should raise the cabinet and have the drainage route checked by the community\u2019s maintenance team. Otherwise, new books may face the same damage.</p><table><caption><b>Volunteer record from Saturday</b></caption><tr><th>Books marked for replacement</th><th>Books kept for drying/review</th></tr><tr><td>12</td><td>23</td></tr></table><p class=\"muted\">The table summarizes the volunteer record; books kept for review are not yet confirmed usable.</p><h4>Help Build a Lasting Solution</h4><p><b>[3]</b> Neighbors can sign up at Monday\u2019s meeting to help plan improvements or suggest replacement titles. Raising the cabinet will not prevent every problem, and a drainage review may identify additional work. Still, practical changes can protect more of the shared collection. Let\u2019s turn one morning of cooperation into a lasting commitment to this useful space.</p></div><div class=\"question\" data-id=\"q7\" data-answer=\"1\" data-why=\"A traces the narrator\u2019s emotional change; B combines information with proposals and a call for community action.\"><span class=\"badge\">Select one</span><h3>Which choice best compares the PRIMARY purposes of the accounts?</h3><label class=\"option\"><input type=\"radio\" name=\"q7\" value=\"0\"> Both mainly provide step-by-step instructions for drying books.</label><label class=\"option\"><input type=\"radio\" name=\"q7\" value=\"1\"> A narrates and reflects on a changed outlook; B urges neighbors to support practical improvements.</label><label class=\"option\"><input type=\"radio\" name=\"q7\" value=\"2\"> A urges readers to close the garden; B narrates the editor\u2019s childhood.</label><label class=\"option\"><input type=\"radio\" name=\"q7\" value=\"3\"> Both mainly describe the color of mud.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q8\" data-answer=\"2\" data-why=\"The narrator shifts from seeing erased work to imagining new stories, while acknowledging that some books remain lost.\"><span class=\"badge\">Select one</span><h3>Part A: Which message is most strongly developed in Account A?</h3><label class=\"option\"><input type=\"radio\" name=\"q8\" value=\"0\"> Every damaged object can be completely repaired.</label><label class=\"option\"><input type=\"radio\" name=\"q8\" value=\"1\"> Careful planning guarantees there will be no storms.</label><label class=\"option\"><input type=\"radio\" name=\"q8\" value=\"2\"> Working together can restore hope even when a loss is not fully repaired.</label><label class=\"option\"><input type=\"radio\" name=\"q8\" value=\"3\"> Only adults can make useful contributions.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q9\" data-answer=\"1,2\" data-why=\"The arrival of neighbors establishes collective work, and the ending identifies renewed willingness. Together they support cooperation and hope.\"><span class=\"badge\">Select 2</span><h3>Part B: Select TWO excerpts that best support the message in Part A.</h3><label class=\"option\"><input type=\"checkbox\" name=\"q9\" value=\"0\"> \u201cAt 8:15 on Saturday, I unlocked the back gate\u2026\u201d</label><label class=\"option\"><input type=\"checkbox\" name=\"q9\" value=\"1\"> \u201cWithin an hour, six neighbors had arrived.\u201d</label><label class=\"option\"><input type=\"checkbox\" name=\"q9\" value=\"2\"> \u201cWhat we restored first was our willingness to begin.\u201d</label><label class=\"option\"><input type=\"checkbox\" name=\"q9\" value=\"3\"> \u201cI had helped paint that cabinet the previous month.\u201d</label><label class=\"option\"><input type=\"checkbox\" name=\"q9\" value=\"4\"> \u201cmuddy water had reached the lowest shelf\u2026\u201d</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q10\" data-answer=\"0\" data-why=\"The opening suggests erased work; the ending sees possibility while admitting incomplete recovery.\"><span class=\"badge\">Select one</span><h3>How does Account A\u2019s tone develop?</h3><label class=\"option\"><input type=\"radio\" name=\"q10\" value=\"0\"> It moves from discouraged to cautiously hopeful.</label><label class=\"option\"><input type=\"radio\" name=\"q10\" value=\"1\"> It remains mocking of the neighbors.</label><label class=\"option\"><input type=\"radio\" name=\"q10\" value=\"2\"> It moves from amused to indifferent.</label><label class=\"option\"><input type=\"radio\" name=\"q10\" value=\"3\"> It becomes certain that all damage has disappeared.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q11\" data-answer=\"0,3\" data-why=\"The contrast between erasure and a continuing beginning reveals the shift from discouragement to hope.\"><span class=\"badge\">Select 2</span><h3>Select TWO excerpts that best show the change in attitude in Account A. (Selectable-text practice)</h3><label class=\"option\"><input type=\"checkbox\" name=\"q11\" value=\"0\"> \u201cI felt as if the storm had erased our work\u2026\u201d</label><label class=\"option\"><input type=\"checkbox\" name=\"q11\" value=\"1\"> \u201cAt 8:15 on Saturday\u2026\u201d</label><label class=\"option\"><input type=\"checkbox\" name=\"q11\" value=\"2\"> \u201cI began dragging branches toward the curb\u2026\u201d</label><label class=\"option\"><input type=\"checkbox\" name=\"q11\" value=\"3\"> \u201cit no longer looked like an ending.\u201d</label><label class=\"option\"><input type=\"checkbox\" name=\"q11\" value=\"4\"> \u201cI unlocked the back gate\u2026\u201d</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q12\" data-answer=\"1\" data-why=\"The figurative comparison conveys the visible damage and regret; it supports a hopeful but not falsely cheerful account.\"><span class=\"badge\">Select one</span><h3>How does \u201ctheir ink had blurred into blue-gray clouds\u201d contribute to meaning and tone in Account A?</h3><label class=\"option\"><input type=\"radio\" name=\"q12\" value=\"0\"> It gives a weather forecast for the next day.</label><label class=\"option\"><input type=\"radio\" name=\"q12\" value=\"1\"> It compares blurred ink to clouds, making the damage vivid and lending sadness to the acknowledged loss.</label><label class=\"option\"><input type=\"radio\" name=\"q12\" value=\"2\"> It proves that books create real clouds.</label><label class=\"option\"><input type=\"radio\" name=\"q12\" value=\"3\"> It makes the whole account mocking and humorous.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q13\" data-answer=\"0\" data-why=\"The section moves from the event\u2019s lessons toward raising the cabinet and reviewing drainage, supporting the persuasive purpose.\"><span class=\"badge\">Select one</span><h3>How does the heading \u201cA Practical Next Step\u201d contribute to Account B?</h3><label class=\"option\"><input type=\"radio\" name=\"q13\" value=\"0\"> It signals a shift from describing the cleanup to proposing preventive actions.</label><label class=\"option\"><input type=\"radio\" name=\"q13\" value=\"1\"> It announces that the garden is permanently closed.</label><label class=\"option\"><input type=\"radio\" name=\"q13\" value=\"2\"> It proves that all books are usable.</label><label class=\"option\"><input type=\"radio\" name=\"q13\" value=\"3\"> It introduces a personal childhood memory.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q14\" data-answer=\"2\" data-why=\"The table organizes the record into two categories. It gives concrete support for planning but does not guarantee the reviewed books are usable.\"><span class=\"badge\">Select one</span><h3>Why does the author include the volunteer-record table?</h3><label class=\"option\"><input type=\"radio\" name=\"q14\" value=\"0\"> To show that all thirty-five books were destroyed.</label><label class=\"option\"><input type=\"radio\" name=\"q14\" value=\"1\"> To replace the author\u2019s proposal with unrelated statistics.</label><label class=\"option\"><input type=\"radio\" name=\"q14\" value=\"2\"> To provide a clear summary of losses and items under review, showing the need for careful recovery planning.</label><label class=\"option\"><input type=\"radio\" name=\"q14\" value=\"3\"> To prove that drying always repairs a book.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q15\" data-answer=\"1\" data-why=\"The recommendations, qualifying language, and invitation to participate support a practical, encouraging attitude.\"><span class=\"badge\">Select one</span><h3>Which statement best analyzes Account B\u2019s tone?</h3><label class=\"option\"><input type=\"radio\" name=\"q15\" value=\"0\"> Bitter, because it blames children for the storm.</label><label class=\"option\"><input type=\"radio\" name=\"q15\" value=\"1\"> Practical and encouraging, because it acknowledges limits while proposing achievable actions.</label><label class=\"option\"><input type=\"radio\" name=\"q15\" value=\"2\"> Carefree, because it ignores all damage.</label><label class=\"option\"><input type=\"radio\" name=\"q15\" value=\"3\"> Hopeless, because it says there is no useful next step.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q16\" data-answer=\"2\" data-why=\"The same detail serves reflective personal meaning in A and evidence-based community planning in B.\"><span class=\"badge\">Select one</span><h3>Both authors mention the title list. How does its function differ?</h3><label class=\"option\"><input type=\"radio\" name=\"q16\" value=\"0\"> In A it proves every book is saved; in B it hides the damage.</label><label class=\"option\"><input type=\"radio\" name=\"q16\" value=\"1\"> In both it is only decorative.</label><label class=\"option\"><input type=\"radio\" name=\"q16\" value=\"2\"> In A it helps the narrator imagine recovery; in B it provides a record supporting replacement and prevention plans.</label><label class=\"option\"><input type=\"radio\" name=\"q16\" value=\"3\"> In A it is an official election ballot; in B it identifies storm clouds.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q17\" data-answer=\"3\" data-why=\"A acknowledges incomplete restoration; B proposes further improvements. Both describe neighbors working together.\"><span class=\"badge\">Select one</span><h3>Which inference is supported by BOTH accounts?</h3><label class=\"option\"><input type=\"radio\" name=\"q17\" value=\"0\"> The cleanup solved every future drainage problem.</label><label class=\"option\"><input type=\"radio\" name=\"q17\" value=\"1\"> All neighbors had agreed on repairs before Saturday.</label><label class=\"option\"><input type=\"radio\" name=\"q17\" value=\"2\"> Mrs. Chen caused the storm damage.</label><label class=\"option\"><input type=\"radio\" name=\"q17\" value=\"3\"> Cooperation helps the community respond, but additional work remains.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div>"}, {"title": "Build your evidence explanation", "time": 6, "body": "<h2>Go beyond naming a purpose or tone.</h2><div class=\"callout\"><b>Claim \u2192 evidence \u2192 meaning \u2192 connection.</b><p>\u201cThe author\u2019s primary purpose is ___. The detail \u2018___\u2019 supports this because ___. The author\u2019s ___ word choice creates a ___ tone, which helps communicate ___.\u201d</p></div><p>Reread both accounts. Support your claims with paragraph numbers and explain why the details matter. A quotation without reasoning is not a complete explanation.</p><label class=\"writing\">Account A: Explain its primary purpose, message, and tone. Trace the tone from the opening to the ending using at least two details.<textarea id=\"theme1\" rows=\"4\" placeholder=\"Explain your thinking using specific text evidence.\"></textarea></label><label class=\"writing\">Account B: Explain how ONE heading and the table convey meaning and support the author\u2019s purpose. Use a specific detail from each feature.<textarea id=\"theme2\" rows=\"4\" placeholder=\"Explain your thinking using specific text evidence.\"></textarea></label><label class=\"writing\">Compare the authors: How does the same cleanup become a personal reflection in A and a call for action in B? Explain how the authors use the title list differently.<textarea id=\"connect\" rows=\"4\" placeholder=\"Explain your thinking using specific text evidence.\"></textarea></label><details><summary>Need a starting point?</summary><p>Account A emphasizes ____, while Account B emphasizes ____. Both mention ____, but A uses that detail to show ____, whereas B uses it to support ____. This difference reflects their purposes because ____.</p></details><details><summary>Review your work</summary><ul><li>I separated WHY (purpose), WHAT (message), and ATTITUDE (tone).</li><li>I examined the whole text before naming the primary purpose.</li><li>I explained what the quoted words suggest.</li><li>I connected features to meaning instead of simply naming them.</li><li>I supported the comparison with details from both accounts.</li></ul></details>"}, {"title": "Remember & submit", "time": 3, "body": "<div class=\"question\" data-id=\"q18\" data-answer=\"1\" data-why=\"The three questions guide different parts of analysis. Titles are clues and reader goals may differ from author goals.\"><span class=\"badge\">Select one</span><h3>Which statement shows that a reader understands purpose, message, and tone?</h3><label class=\"option\"><input type=\"radio\" name=\"q18\" value=\"0\"> The purpose is hopeful, the tone is to persuade, and the message is mud.</label><label class=\"option\"><input type=\"radio\" name=\"q18\" value=\"1\"> Purpose asks why a writer wrote; message asks what understanding is conveyed; tone asks what attitude is expressed.</label><label class=\"option\"><input type=\"radio\" name=\"q18\" value=\"2\"> A title always reveals all three without reading.</label><label class=\"option\"><input type=\"radio\" name=\"q18\" value=\"3\"> Reader\u2019s purpose and author\u2019s purpose must be identical.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><label class=\"writing\">Exit ticket: Explain purpose, message, and tone in your own words. Then write one useful question to ask BEFORE reading and one to ask WHILE analyzing word choice.<textarea id=\"exit\" rows=\"4\" placeholder=\"Explain your thinking using specific text evidence.\"></textarea></label><div class=\"callout\"><b>Take it with you:</b> WHY \u2022 WHAT \u2022 ATTITUDE.<br>Preview \u2192 Predict \u2192 Plan.<br>Words/detail \u2192 meaning \u2192 evidence-based explanation.</div><h2>Your completion report</h2><p>Check all practice questions and complete the six written responses. Save your report as a PDF, download a text copy, or screenshot the report on your iPad. Upload it to Canvas as directed by Mrs. Rees. Results are not sent to Canvas automatically.</p><button id=\"reportBtn\">My completion report</button><button id=\"downloadBtn\">Download report (.txt)</button><button id=\"printBtn\">Print / save PDF</button><div id=\"report\" aria-live=\"polite\"></div><p class=\"muted\">Standards reference: <a href=\"https://www.fldoe.org/core/fileparse.php/20070/urlt/12-3.pdf\">Florida B.E.S.T. ELA</a>. Practice formats informed by the <a href=\"https://www.fldoe.org/file/20102/TDS-FAST-ELA.pdf\">FAST ELA Test Design Summary</a>.</p>"}];
let page=0,answers={},checks={},fields={},seconds=0;const KEY='purposeMessageToneTutorial_v1';
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){page=s.page||0;answers=s.answers||{};checks=s.checks||{};fields=s.fields||{};seconds=s.seconds||0}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({page,answers,checks,fields,seconds}))}catch(e){}}
function capture(){document.querySelectorAll('#panel input[type=radio],#panel input[type=checkbox]').forEach(el=>{if(!answers[el.name])answers[el.name]=[];});document.querySelectorAll('.question').forEach(el=>answers[el.dataset.id]=[...el.querySelectorAll('input:checked')].map(x=>+x.value));document.querySelectorAll('#panel textarea,#student').forEach(el=>fields[el.id]=el.value);save()}
function render(){document.getElementById('panel').innerHTML='<span class="badge">Section '+(page+1)+' of 8</span>'+sections[page].body;document.getElementById('nav').innerHTML=sections.map((s,i)=>'<button class="'+(i===page?'current':'')+'" data-page="'+i+'">'+(i+1)+'. '+s.title+'</button>').join('');document.getElementById('progress').value=page+1;document.getElementById('back').disabled=page===0;document.getElementById('next').disabled=page===7;document.querySelectorAll('#panel input[type=radio],#panel input[type=checkbox]').forEach(el=>el.checked=(answers[el.name]||[]).includes(+el.value));document.querySelectorAll('#panel textarea,#student').forEach(el=>el.value=fields[el.id]||'');document.querySelectorAll('.question').forEach(el=>{if(checks[el.dataset.id])showFeedback(el)});save()}
function showFeedback(el){const c=checks[el.dataset.id],f=el.querySelector('.feedback');f.style.display='block';f.textContent=(c.correct?'Correct. ':'Revisit this. ')+el.dataset.why+' Correct choice(s): '+el.dataset.answer.split(',').map(v=>el.querySelector('input[value="'+v+'"]').parentElement.textContent.trim()).join(' | ')}
document.addEventListener('input',e=>{if(e.target.closest('#panel')){if(e.target.name){delete checks[e.target.name];const f=e.target.closest('.question').querySelector('.feedback');f.style.display='none'}capture()}});
document.addEventListener('click',e=>{if(e.target.dataset.page!==undefined){capture();page=+e.target.dataset.page;render();window.scrollTo(0,0)}if(e.target.classList.contains('check')){capture();let el=e.target.closest('.question'),got=answers[el.dataset.id]||[],wanted=el.dataset.answer.split(',').map(Number);if(!got.length){el.querySelector('.feedback').style.display='block';el.querySelector('.feedback').textContent='Choose an answer first.';return}checks[el.dataset.id]={correct:got.length===wanted.length&&wanted.every(v=>got.includes(v))};showFeedback(el);save()}if(e.target.id==='reportBtn')makeReport();if(e.target.id==='printBtn'){makeReport();window.print()}if(e.target.id==='downloadBtn'){const txt=makeReport();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='Purpose-Message-Tone-Completion-Report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});
document.getElementById('back').onclick=()=>{capture();page--;render();window.scrollTo(0,0)};document.getElementById('next').onclick=()=>{capture();page++;render();window.scrollTo(0,0)};
function makeReport(){capture();const ids=Array.from({length:18},(_,i)=>'q'+(i+1)),written=['toolkit','guided','theme1','theme2','connect','exit'];const done=ids.filter(id=>checks[id]).length,correct=ids.filter(id=>checks[id]?.correct).length,w=written.filter(id=>(fields[id]||'').trim()).length;let t='PURPOSE, MESSAGE & TONE • COMPLETION REPORT\nStudent: '+(fields.student||'[Name missing]')+'\nDate: '+new Date().toLocaleString()+'\nStatus: '+(done===18&&w===6&&fields.student?.trim()?'All required fields completed':'Incomplete — review missing work')+'\nPractice checked: '+done+'/18\nCurrent correct after feedback/retries: '+correct+'/18 (practice, not mastery score)\nWritten responses: '+w+'/6 (teacher review required)\nActive page time: '+Math.floor(seconds/60)+' minutes; time is not proof of learning.\n';ids.forEach(id=>{t+='\n'+id.toUpperCase()+': '+(!checks[id]?'Not checked':checks[id].correct?'Correct':'Needs review')});written.forEach(id=>t+='\n\n'+id.toUpperCase()+':\n'+(fields[id]||'[Missing]'));document.getElementById('report').textContent=t;return t}
setInterval(()=>{if(!document.hidden){seconds++;if(seconds%10===0)save()}},1000);render();
</script></body></html>
